project:
  name: openmodelica-pytorch-residual-hybrid
  seed: 42

simulation:
  fmu_path: artifacts/fmu/ThermalPlant.fmu
  start_time: 0.0
  stop_time: 300.0
  step_size: 0.01
  initial_temperature: 25.0
  input_variables:
    power: power
    ambient: ambient
  output_variables:
    temperature: temperature

thermal_model:
  R: 0.5
  C: 100.0
  T_start: 25.0

synthetic_system:
  R_true: 0.5
  C_true: 100.0
  nonlinear_coefficient: 0.002
  noise_std: 0.5
  # Optional: replace the single power step with an arbitrary up/down
  # profile as a list of [time, power] breakpoints (each value holds
  # until the next breakpoint's time). Comment out to fall back to the
  # legacy single-step profile (0 W -> 50 W at t=20s).
  power_schedule:
    - [0, 20]      # start cold
    - [10, 1000]    # ramp up
    - [20, 60]    # cool back down
    - [60, 2000]    # heat up further
    - [80, 5]     # cool down again
  # Optional, same idea, for a time-varying ambient temperature:
  # ambient_schedule:
  #   - [0, 25]
  #   - [50, 30]

data:
  raw_path: data/raw/synthetic_measurements.csv
  processed_path: data/processed/residual_dataset.csv
  validation_fraction: 0.2

model:
  input_features:
    - temperature_sim
    - power
    - ambient
  hidden_sizes:
    - 32
    - 32
  activation: tanh
  output_size: 1

training:
  epochs: 5
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0
  checkpoint_path: artifacts/checkpoints/residual_model.pt
  normalization_path: artifacts/checkpoints/normalization.json
  train_loss_path: artifacts/metrics/train_loss.csv
  val_loss_path: artifacts/metrics/val_loss.csv

results:
  inference_path: results/hybrid_predictions.csv
  plot_path: results/plots/temperature_comparison.png
